<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Tools</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --background: #071a33;
            --text: #f8fafc;
            --muted: #cbd5e1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: var(--background);
            color: var(--text);
            line-height: 1.5;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        .logout-button {
            padding: 0.6rem 1rem;
            border: 1px solid var(--muted);
            border-radius: 0.5rem;
            color: var(--text);
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s ease-in-out;
        }

        .logout-button:hover {
            background-color: rgba(203, 213, 225, 0.15);
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 6rem 2rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 3.5rem;
            line-height: 1.2;
            margin-bottom: 1rem;
        }

        .hero p {
            color: var(--muted);
            font-size: 1.15rem;
            margin-bottom: 2.5rem;
        }

        .tool-links {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 1rem;
            width: 100%;
        }

        .tool-button {
            display: inline-block;
            padding: 1rem 1.25rem;
            background-color: var(--primary);
            color: var(--text);
            border-radius: 0.5rem;
            font-weight: 600;
            text-decoration: none;
            transition: background-color 0.2s ease-in-out, transform 0.2s ease-in-out;
        }

        .tool-button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        @media (max-width: 640px) {
            .hero {
                padding-top: 4rem;
            }

            .hero h1 {
                font-size: 2.5rem;
            }

            .tool-links {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Data Tools</div>
        <a class="logout-button" href="index.html">Log Out</a>
    </nav>

    <main class="hero">
        <h1>Choose a Data Tool</h1>
        <p>Select a local service to continue.</p>

        <div class="tool-links">
            <!-- Change these href values to your local application URLs. -->
            <a class="tool-button" href="http://localhost:3000">Data Tool 1</a>
            <a class="tool-button" href="http://localhost:3001">Data Tool 2</a>
            <a class="tool-button" href="http://localhost:3002">Data Tool 3</a>
        </div>
    </main>
</body>
</html>
