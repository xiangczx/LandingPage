<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Landing Page</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --secondary: #cbd5e1;
            --secondary-hover: #e2e8f0;
            --background: #071a33;
            --text-dark: #f8fafc;
            --text-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--background);
            color: var(--text-dark);
            line-height: 1.5;
        }

        /* Navbar Layout */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
        }

        /* Hero Section */
        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 6rem 2rem;
            max-width: 800px;
            margin: 0 auto;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1.5rem;
            letter-spacing: -0.05em;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--secondary);
            margin-bottom: 2.5rem;
        }

        /* Button Framework */
        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 0.5rem;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            border: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: var(--text-light);
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: var(--text-light);
            color: var(--secondary);
            border: 1px solid #cbd5e1;
        }

        .btn-secondary:hover {
            background-color: #f1f5f9;
            color: var(--secondary-hover);
            transform: translateY(-1px);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            width: min(100%, 24rem);
            text-align: left;
        }

        .login-form label {
            font-weight: 600;
            color: var(--text-dark);
        }

        .login-form input {
            width: 100%;
            padding: 0.75rem 1rem;
            margin-bottom: 0.75rem;
            font: inherit;
            border: 1px solid #cbd5e1;
            border-radius: 0.5rem;
            background-color: var(--text-light);
        }

        .login-form input:focus {
            outline: 2px solid var(--primary);
            outline-offset: 1px;
        }

        .login-form .btn {
            width: 100%;
        }

        .login-error {
            color: #fca5a5;
            font-size: 0.95rem;
            margin-bottom: 0.5rem;
        }

        /* Responsive Breakpoints */
        @media (max-width: 640px) {
            .hero h1 {
                font-size: 2.5rem;
            }
            .btn-group {
                flex-direction: column;
                width: 100%;
            }
            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Data Tools</div>
    </nav>

    <main class="hero">
        <h1>Access to Data Tools</h1>
        <form class="login-form" action="#" method="post">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" autocomplete="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <p class="login-error" id="login-error" role="alert" hidden>Invalid username or password.</p>
            <button type="submit" class="btn btn-primary">Log In</button>
        </form>
    </main>

    <script>
        const validUsername = "admin";
        const validPassword = "password123";
        const loginForm = document.querySelector(".login-form");
        const loginError = document.querySelector("#login-error");

        loginForm.addEventListener("submit", (event) => {
            event.preventDefault();

            const username = document.querySelector("#username").value;
            const password = document.querySelector("#password").value;
            const isValid = username === validUsername && password === validPassword;

            loginError.hidden = isValid;

            if (isValid) {
                window.location.href = "data-tools.html";
            }
        });
    </script>

</body>
</html>
